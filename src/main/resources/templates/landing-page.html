<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Expense Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>
        body {
            background: linear-gradient(135deg, #1abc9c, #16a085);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }

        .card-box {
            background: #fff;
            color: #333;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .counter {
            font-size: 28px;
            font-weight: bold;
        }

        .cta-btn {
            background: #fff;
            color: #16a085;
            font-weight: 600;
            padding: 12px 36px;
            border-radius: 30px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <!-- HEADER -->
    <div class="text-center mb-5">
        <h1 class="fw-bold">Expense Tracker</h1>
        <p class="lead">Clear overview of your spending</p>
        <a th:href="@{/list}" class="btn cta-btn mt-3">
            View My Expenses
        </a>
    </div>

    <!-- OVERVIEW -->
    
    <!-- BAR GRAPH -->
    <div class="row justify-content-center"
         th:if="${overview.categoryTotals != null and !overview.categoryTotals.isEmpty()}">

        <div class="col-md-8">
            <div class="card-box">
                <h6 class="mb-3">Spending by Category</h6>
                <canvas id="categoryBarChart" height="140"></canvas>
            </div>
        </div>

    </div>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- COUNTER ANIMATION -->
<script>
    document.querySelectorAll('.counter').forEach(counter => {
        let target = Number(counter.getAttribute('data-target')) || 0;
        let count = 0;
        const step = Math.max(1, Math.floor(target / 60));

        const interval = setInterval(() => {
            count += step;
            if (count >= target) {
                counter.innerText = target;
                clearInterval(interval);
            } else {
                counter.innerText = count;
            }
        }, 20);
    });
</script>

<!-- BAR CHART -->
<script th:inline="javascript">
    const categoryData = /*[[${overview.categoryTotals}]]*/ {};

    const labels = Object.keys(categoryData);
    const values = Object.values(categoryData);

    if (labels.length > 0) {
        new Chart(document.getElementById('categoryBarChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Amount',
                    data: values,
                    backgroundColor: '#1abc9c'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        });
    }
</script>

</body>
</html>
