<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav class="navbar navbar-expand-lg mb-5"
     th:fragment="navbar(showAbout, showIn, showUp, showList, showAdd, showProfile)"
     style="background: transparent;">

    <div class="container card-box d-flex align-items-center justify-content-between">

        <!-- BRAND -->
        <a class="navbar-brand fw-bold text-success fs-4" th:href="@{/}">
            Expense Tracker
        </a>

        <!-- TOGGLER -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- MENU -->
        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ms-auto align-items-center">

                <li th:if="${showAbout == 'yes'}" class="nav-item">
                    <a class="nav-link fw-semibold" href="#about">About</a>
                </li>

                <li th:if="${showIn == 'yes'}" class="nav-item">
                    <a class="nav-link fw-semibold" th:href="@{/showLoginPage}">
                        Sign in
                    </a>
                </li>

                <li th:if="${showUp == 'yes'}" class="nav-item">
                    <a class="nav-link fw-semibold" th:href="@{/showRegistrationForm}">
                        Sign up
                    </a>
                </li>

                <li th:if="${showList == 'yes'}" class="nav-item">
                    <a class="nav-link fw-semibold" th:href="@{/list}">
                        Expenses
                    </a>
                </li>

                <li th:if="${showAdd == 'yes'}" class="nav-item ms-lg-2">
                    <a class="btn cta-btn btn-sm" th:href="@{/showAdd}">
                        + Add
                    </a>
                </li>

                <!-- LOGOUT -->
                <li th:if="${showProfile == 'yes'}" class="nav-item ms-lg-3">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit"
                                class="btn btn-outline-danger btn-sm fw-semibold">
                            <i class="fa-solid fa-right-from-bracket me-1"></i>
                            Logout
                        </button>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>

</body>
</html>
