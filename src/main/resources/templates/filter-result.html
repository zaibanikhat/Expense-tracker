<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Expenses</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <!-- App CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="fragments/navbar :: navbar('no','no','no','yes','yes','yes')"></div>

<div class="container">

    <div class="text-center mb-4">
        <h4 class="fw-bold">My Expenses</h4>
        <p class="text-light">All your recorded expenses at one place</p>
    </div>

    <div class="row g-4">

        <div class="col-md-4"
             th:each="exp : ${expenseList}">

            <div class="card-box h-100">

                <div class="d-flex justify-content-between mb-2">
                    <span class="fw-semibold text-success">
                        <i class="fa fa-tag me-1"></i>
                        <span th:text="${exp.categoryName}"></span>
                    </span>
                    <span class="fw-bold">
                        ₹ <span th:text="${exp.amount}"></span>
                    </span>
                </div>

                <hr>

                <p class="mb-1">
                    <i class="fa fa-calendar me-1"></i>
                    <span th:text="${exp.date}"></span>
                </p>

                <p class="mb-1">
                    <i class="fa fa-clock me-1"></i>
                    <span th:text="${exp.time}"></span>
                </p>

                <p class="text-muted small mt-2"
                   th:text="${exp.description}"></p>

                <div class="d-flex justify-content-between mt-3">

                    <a th:href="@{/showUpdate(expId=${exp.id})}"
                       class="btn btn-outline-success btn-sm">
                        <i class="fa fa-pen"></i> Edit
                    </a>

                    <a th:href="@{/delete(expId=${exp.id})}"
                       class="btn btn-outline-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this expense?')">
                        <i class="fa fa-trash"></i> Delete
                    </a>

                </div>

            </div>
        </div>

        <!-- EMPTY STATE -->
        <div class="col-12 text-center"
             th:if="${expenseList == null or #lists.isEmpty(expenseList)}">
            <div class="card-box">
                <i class="fa fa-receipt fa-2x mb-2 text-muted"></i>
                <p class="mb-0">No expenses found</p>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
