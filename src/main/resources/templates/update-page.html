<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Update Expense</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <!-- App CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="fragments/navbar :: navbar('no','no','no','yes','yes','yes')"></div>

<div class="container">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card-box">

                <h4 class="text-center mb-4">Update Expense</h4>

                <!-- IMPORTANT: keep expId -->
                <form th:action="@{/submitUpdate(expId=${expenseId})}"
                      th:object="${expense}"
                      method="post">

                    <!-- CATEGORY -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Category</label>
                        <select class="form-select"
                                th:field="*{category}" required>
                            <option value="groceries">Groceries</option>
                            <option value="utilities">Utilities</option>
                            <option value="transportation">Transportation</option>
                            <option value="dining">Dining Out</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="shopping">Shopping</option>
                            <option value="travel">Travel</option>
                            <option value="education">Education</option>
                        </select>
                    </div>

                    <!-- AMOUNT -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Amount</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{amount}"
                               required>
                    </div>

                    <!-- DATE TIME -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Date & Time</label>
                        <input type="datetime-local"
                               class="form-control"
                               th:field="*{dateTime}"
                               required>
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea class="form-control"
                                  th:field="*{description}"
                                  rows="3"></textarea>
                    </div>

                    <!-- ACTIONS -->
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/list}" class="btn btn-outline-secondary btn-sm">
                            Cancel
                        </a>
                        <button type="submit" class="btn cta-btn btn-sm">
                            <i class="fa fa-save me-1"></i>
                            Update
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
